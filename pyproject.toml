[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-screen"
version = "0.1.0"
description = "Screen text for phone numbers, emails, street addresses and roster names before it leaves for a third party model."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
pii-screen = "pii_screen.cli:main"

[tool.setuptools]
packages = ["pii_screen"]
